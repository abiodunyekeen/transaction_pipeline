name: Transaction Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Allows us to manually run the workflow from GitHub.
  workflow_dispatch:


jobs:

  # ======================================================
  # JOB 1: FAST UNIT / MOCK TESTS
  # ======================================================

  unit-tests:

    # GitHub provides a temporary Linux runner.
    runs-on: ubuntu-latest

    steps:

      # Download repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Python version used by our project.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Python dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests that do NOT require Databricks.
      - name: Run unit tests
        run: |
          pytest -m "not spark and not integration" -v


  # ======================================================
  # JOB 2: REAL DATABRICKS TESTS
  # ======================================================

  databricks-integration-tests:

    # Do not start this job unless unit tests succeeded.
    needs: unit-tests

    runs-on: ubuntu-latest

    # Use the GitHub TEST environment.
    #
    # This is where TEST-specific secrets/variables live.
    environment: test

    # Pass Databricks credentials/configuration into
    # the workflow process as environment variables.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Tell Databricks Connect to use serverless compute.
      DATABRICKS_SERVERLESS_COMPUTE_ID: auto

    steps:

      # Download repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the same Python version as local development.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Validate that Databricks Connect can authenticate
      # and reach the configured serverless environment.
      - name: Validate Databricks connection
        run: |
          databricks-connect test

      # Run Spark / Delta integration tests.
      - name: Run Databricks integration tests
        run: |
          pytest -m integration -v